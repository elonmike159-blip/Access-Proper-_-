name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if it was uploaded as a zip
        run: |
          if ! find . -name settings.gradle.kts -not -path './.git/*' | grep -q .; then
            for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do unzip -oq "$z" -d unzipped; done
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          D=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "Project dir: $D"
          cd "$D"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AccessProper-APK
          path: '**/build/outputs/apk/debug/*.apk'
